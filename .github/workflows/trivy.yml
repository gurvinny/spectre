# Trivy vulnerability and misconfiguration scanning
# Author: gurvinny
#
# Covers the gap CodeQL leaves: CodeQL analyses source, not container base
# images or Dockerfile configuration. Findings upload to the Security tab
# alongside the CodeQL ones.
name: Trivy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  repo:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependency vulnerabilities, Dockerfile misconfiguration and any
      # committed credential shapes, in one pass over the tree.
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          # Fail on a HIGH or CRITICAL finding that has a fix available. A
          # finding with no upstream fix cannot be acted on, so it is still
          # reported to the Security tab but does not block a merge.
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload results
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  bases:
    name: Read base images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      # Read the FROM lines rather than hardcoding a list, so a base-image bump
      # is scanned the moment it lands instead of whatever the list remembers.
      - id: read
        run: |
          images=$(grep -hoiE '^FROM[[:space:]]+[^[:space:]]+' web/Dockerfile sensor/Dockerfile \
            | awk '{print $2}' | sort -u | jq -R . | jq -sc .)
          [ "$images" != "[]" ] || { echo "no FROM lines found" >&2; exit 1; }
          echo "images=$images" >> "$GITHUB_OUTPUT"

  images:
    name: Trivy base image scan
    needs: bases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.bases.outputs.images) }}
    steps:
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          format: table
          # Report only. Bare base images carry fixable findings in packages the
          # shipped images remove or upgrade (npm, pip tooling, Debian updates),
          # so the gate is on the built images in docker.yml, not here.
          ignore-unfixed: true
          exit-code: "0"
