name: SPECTRE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  sensor-test:
    name: Sensor Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          cd sensor
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Shuffled across three seeds, every test file must contribute tests, and
      # the test and assertion counts must stay above the floors in the script.
      - name: Run sensor tests
        run: |
          cd sensor
          python scripts/run_tests.py

  web-test:
    name: Web Console Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Unit tests
        run: |
          cd web
          npm run test

      - name: Build
        run: |
          cd web
          npm run build

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Host suite for the portable core (ASan + UBSan, floors enforced), then
      # every line kind is checked against the sensor's real parser.
      - name: Host tests and line contract
        run: make -C firmware/test samples

      - name: Build the image (ESP-IDF v5.5.4)
        run: |
          docker run --rm -v "$PWD":/project -w /project/firmware/spectre-sniffer \
            espressif/idf:v5.5.4 idf.py set-target esp32c5 build

      - name: Image checksums
        run: |
          cd firmware/spectre-sniffer/build
          sudo chown -R "$(id -u)" .
          sha256sum spectre-sniffer.bin bootloader/bootloader.bin \
            partition_table/partition-table.bin | tee SHA256SUMS

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: spectre-sniffer-esp32c5
          path: |
            firmware/spectre-sniffer/build/spectre-sniffer.bin
            firmware/spectre-sniffer/build/bootloader/bootloader.bin
            firmware/spectre-sniffer/build/partition_table/partition-table.bin
            firmware/spectre-sniffer/build/flash_args
            firmware/spectre-sniffer/build/flasher_args.json
            firmware/spectre-sniffer/build/SHA256SUMS
          retention-days: 30
