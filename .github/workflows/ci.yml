name: SPECTRE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  sensor-test:
    name: Sensor Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          cd sensor
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Shuffled across three seeds, every test file must contribute tests, and
      # the test and assertion counts must stay above the floors in the script.
      - name: Run sensor tests
        run: |
          cd sensor
          python scripts/run_tests.py

  web-test:
    name: Web Console Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Unit tests
        run: |
          cd web
          npm run test

      - name: Build
        run: |
          cd web
          npm run build
