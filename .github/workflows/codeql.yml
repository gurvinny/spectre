# SPECTRE — CodeQL static analysis
# Author: gurvinny
#
# Advanced setup (a committed workflow) rather than GitHub's default setup, to
# keep the scan configuration in the repo alongside ci.yml.
#
# `actions` covers the workflow files themselves. It was missing until now, so
# every workflow in this repo -- including the ones holding write permissions
# and the Dependabot auto-merge gate -- was unscanned while the application
# code around them was not.
name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly, so advisories that land against unchanged code still surface.
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ javascript-typescript, python, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # All three are interpreted, so no build is needed. The C firmware is
          # left out on purpose: autobuild cannot build an ESP-IDF project, and
          # the Firmware build job (-Werror) plus the sanitized host tests in
          # ci.yml cover it instead.
          build-mode: none
          # Security-focused; the quality suite adds a lot of style noise on a
          # repo this size without surfacing more real issues.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
