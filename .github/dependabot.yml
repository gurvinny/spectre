# SPECTRE — automated dependency updates
# Author: gurvinny
#
# Security updates are enabled repo-side; this adds scheduled version updates so
# dependencies do not drift into an advisory in the first place.
version: 2

updates:
  # SOC console (Next.js / React / three.js)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch only. A grouped PR does not expose per-dependency versions to
      # fetch-metadata, so the 0.x rule cannot be applied inside a group --
      # minors therefore arrive individually where they can be judged.
      patch:
        update-types:
          - patch
    ignore:
      # Type definitions track the runtime's major, which moves deliberately
      # with the Docker base image, not whenever a new major is published.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Sensor API layer (the ingest/detect/storage core is stdlib-only)
  - package-ecosystem: pip
    directory: /sensor
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Container base images
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Node majors move to the next LTS by hand; odd-numbered releases are
      # never LTS and a major bump changes the runtime under the whole app.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /sensor
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Workflow actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
